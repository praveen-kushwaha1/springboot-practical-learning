theme:
    name: material
    language: en
    logo: assets/spring-icon.svg
    favicon: assets/spring-icon.svg
    features:
        - announce.dismiss
        - navigation.instant
        - navigation.instant.progress
        - navigation.tabs
        - navigation.sections
        - navigation.expand
        - navigation.top
        - navigation.footer
        - search.suggest
        - search.highlight
        - search.share
        - content.code.copy
        - content.code.annotate
        - content.action.edit
        - content.action.view
        - toc.follow
    palette:
        - scheme: default
          primary: indigo
          accent: deep orange
          toggle:
              icon: material/weather-night
              name: Switch to dark mode
        - scheme: slate
          primary: blue
          accent: amber
          toggle:
              icon: material/weather-sunny
              name: Switch to light mode
    font:
        text: Inter
        code: JetBrains Mono
    icon:
        repo: fontawesome/brands/github

plugins:
    - search:
          lang: en
    - tags

markdown_extensions:
    - admonition
    - attr_list
    - def_list
    - footnotes
    - md_in_html
    - tables
    - toc:
          permalink: true
    - pymdownx.details
    - pymdownx.emoji:
          emoji_index: !!python/name:material.extensions.emoji.twemoji
          emoji_generator: !!python/name:material.extensions.emoji.to_svg
    - pymdownx.highlight:
          anchor_linenums: true
          line_spans: __span
          pygments_lang_class: true
    - pymdownx.inlinehilite
    - pymdownx.keys
    - pymdownx.superfences
    - pymdownx.tabbed:
          alternate_style: true
    - pymdownx.tasklist:
          custom_checkbox: true

extra_css:
    - stylesheets/extra.css

extra_javascript:
    - javascripts/extra.js

extra:
    generator: false
    social:
        - icon: fontawesome/brands/github
          link: https://github.com/praveen-kushwaha1/springboot-practical-learning
          name: GitHub repository

copyright: Copyright &copy; 2026 Spring Boot Practical Learning
